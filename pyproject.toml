[project]
name = "pypi-parker"
description = "Easily protect against namesquatting on PyPI"
readme = "README.rst"
authors =[
    {name="Matt Bullock"}
]
license = "Apache-2.0"
license-files = [
    "LICENSE"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities",
]
keywords = [
    "pypi",
    "warehouse",
    "distutils",
    "typosquatting",
]
version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
    "readme-renderer>=44.0",
    "setuptools>=80.9.0",
]

[project.urls]
Repository = "https://github.com/mattsb42/pypi-parker"

[project.scripts]
pypi-parker = "pypi_parker:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.0",
]

[tool.ruff.lint]
select = ['E', 'F', 'I', 'N', 'W', 'UP', 'RUF']

